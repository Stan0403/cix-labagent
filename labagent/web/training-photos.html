<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabAgent · 训练拍照</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/training-photos.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">← 返回 LabAgent</a>
  </header>
  <main>
    <section class="panel observation">
      <div class="panel-title"><h2>YOLO 训练拍照</h2><span id="total" class="pill">读取照片数量…</span></div>
      <p class="muted">摆好器材后点一次「拍照并保存」。只保存当前画面，不运行识别、不标注。</p>
      <div class="media-area">
        <div id="placeholder"><p>打开相机后，这里会显示实时画面。</p></div>
        <video id="video" class="hidden" autoplay muted playsinline></video>
      </div>
      <div class="action-row wrap">
        <button id="start" class="secondary">打开摄像头</button>
        <button id="save" class="primary" disabled>拍照并保存</button>
        <button id="stop" class="ghost" disabled>关闭摄像头</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <form id="auth" class="hidden">
        <label for="token">LabAgent 访问令牌</label>
        <input id="token" type="password" autocomplete="off">
        <button class="secondary" type="submit">应用访问令牌</button>
      </form>
    </section>
  </main>
</body>
</html>
