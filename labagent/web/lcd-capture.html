<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>O6 · 液晶数据采集</title>
  <link rel="stylesheet" href="/static/lcd-capture.css">
  <script src="/static/lcd-capture.js" defer></script>
</head>
<body>
  <header><div><span class="eyebrow">LABAGENT · DATA COLLECTION</span><h1>液晶读数采集</h1></div><span id="count" class="badge">本批 0 张</span></header>
  <main>
    <section class="preview">
      <video id="video" autoplay muted playsinline></video>
      <div id="placeholder">打开摄像头，摆好万用表。<small>照片保留实际采集分辨率，不带文字或预览标记。</small></div>
      <div class="preview-bar"><span id="resolution">摄像头未打开</span><span>空格键拍照 · Esc 关闭摄像头</span></div>
      <div id="flash" aria-hidden="true"></div>
    </section>
    <aside>
      <label for="camera">摄像头</label><select id="camera"><option value="">默认摄像头</option></select>
      <div class="row"><button id="start">打开摄像头</button><button id="stop" class="secondary" disabled>关闭</button></div>
      <label for="kind">这组照片的类型</label>
      <select id="kind"><option value="unlabeled">待标注 — 先拍照，后面统一标注</option><option value="reading">可读数字 — 已核对屏幕读数</option><option value="blank">空屏 — 没有显示数字</option><option value="unreadable">看不清 — 模糊、反光或遮挡</option><option value="overrange">超量程 — 记录实际显示的字符</option></select>
      <label for="label">屏幕原样读数</label><input id="label" type="text" maxlength="25" autocomplete="off" placeholder="例如 1.353、-0.012、.001" disabled>
      <p class="hint">保留负号、小数点和前导零。输入后按 Enter 回到拍照；更换读数后请更新标签。</p>
      <label for="note">备注 <span>选填</span></label><input id="note" type="text" maxlength="500" placeholder="例如：20 V 档、侧视、轻微反光">
      <button id="capture" class="capture" disabled>拍照保存 <kbd>Space</kbd></button>
      <p id="status" role="status" aria-live="polite">照片保存在开发板。先打开摄像头，再按空格键拍照。</p>
      <div class="batch"><label for="batch-name">拍摄批次备注 <span>选填</span></label><input id="batch-name" maxlength="100" placeholder="例如：下午自然光 / 第二次拍摄">
      <button id="new-batch" class="secondary">新建拍摄批次</button><p id="batch-id" class="hint">正在准备批次…</p><a id="manifest" hidden>下载本批标签记录</a></div>
    </aside>
  </main>
  <footer>同一读数可以连续拍摄。换角度、距离和光照采集；无法辨认的照片请单独标记。</footer>
</body>
</html>
