[Common]
mode = build

[Parser]
model_type = onnx
model_name = rec
detection_postprocess =
model_domain = image_classification
input_model = model/rec.onnx
output_dir = ./out
input_shape = [1, 3, 32, 400]
input = x
output = linear_1.tmp_1

[Optimizer]
calibration_data = datasets/rec_cal.npy
calibration_batch_size = 1
metric_batch_size = 1
output_dir = ./out
dataset = numpydataset
dump_dir = ./
save_statistic_info = True
quantize_method_for_activation = per_tensor_asymmetric
trigger_float_op = disable & <[Concat,relu,LSTM]:float16_preferred!>
cast_dtypes_for_lib = True

[GBuilder]
target = X2_1204MP3
outputs = rec.cix
tiling = fps